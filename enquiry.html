<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Enquiries | Urban Thread</title>
    <meta name="description"
          content="Contact Urban Thread with questions about streetwear products, clothing sizes and product availability.">
    <meta name="keywords"
          content="Urban Thread product enquiry, clothing availability, streetwear sizes, product questions, affordable clothing">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <!-- Header and navigation -->
    <header>
        <h1><a href="index.html">Urban Thread</a></h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html" class="active">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <!-- Enquiry page content -->
    <main>
        <section class="enquiry-section">
            <h2>Send Us an Enquiry</h2>
            <p>
                Have a question about our products, sizes or availability?
                Complete the form below to receive information about your
                selected product.
            </p>
            <!-- Enquiry form -->
            <form id="enquiry-form">
                <!-- Customer name -->
                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    minlength="2"
                    maxlength="60"
                    autocomplete="name"
                    required
                >
                <br><br>
                <!-- Customer email -->
                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
                <br><br>
                <!-- Product selection -->
                <label for="product">Select a Product:</label>
                <select id="product" name="product" required>
                    <option value="">Select a product</option>
                    <option value="tshirt">T-Shirt</option>
                    <option value="hoodie">Hoodie</option>
                    <option value="jeans">Jeans</option>
                    <option value="cap">Cap</option>
                    <option value="sneakers">Sneakers</option>
                </select>
                <br><br>
                <!-- Customer enquiry -->
                <label for="message">Your Enquiry:</label>
                <br>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    maxlength="500"
                    minlength="10"
                    placeholder="Ask us about the product, sizes or availability."
                    required
                ></textarea>
                <br><br>
                <!-- Submit button -->
                <button type="submit">Submit Enquiry</button>
                <!-- Feedback displayed after successful validation -->
                <p
                    id="enquiry-feedback"
                    role="status"
                    aria-live="polite"
                    hidden>
                </p>
            </form>
        </section>
    </main>
    <!-- Footer -->
    <footer>
        <p>Contact | Social Media | Copyright</p>
        <p>&copy; 2026 Urban Thread. All rights reserved.</p>
    </footer>
</body>
</html>
