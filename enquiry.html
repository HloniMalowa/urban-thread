<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Urban Thread</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header and navigation -->
    <header>
        <h1><a href="index.html">Urban Thread</a></h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html" class="active">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <!-- Enquiry page content -->
    <main>

        <section>
            <h2>Send Us an Enquiry</h2>

            <p>
                Have a question about our products, sizes or availability?
                Complete the form below and we will get back to you.
            </p>

            <form action="#" method="post"></form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <label for="product">Product:</label>
                <select id="product" name="product">
                    <option value="">Select a product</option>
                    <option value="tshirt">T-Shirt</option>
                    <option value="hoodie">Hoodie</option>
                    <option value="jeans">Jeans</option>
                    <option value="cap">Cap</option>
                    <option value="sneakers">Sneakers</option>
                </select>

                <br><br>

                <label for="message">Your Enquiry:</label>
                <br>
                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Enter your question here" required></textarea>
               
                    <br><br>

                <button type="submit">Submit Enquiry</button>

            <form action="#" method="post"></form>
        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>Contact | Social Media | Copyright</p>
        <p>&copy; 2026 Urban Thread. All rights reserved.</p>
    </footer>

</body>
</html>
